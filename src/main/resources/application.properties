spring.application.name=chain

server.port=8080

spring.datasource.url=jdbc:mysql://localhost:3306/user?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.default_batch_fetch_size=100

jwt.access-token-expiration-minutes=10
jwt.refresh-token-expiration-days=7

aws.s3.access-key=${AWS_ACCESS_KEY}
aws.s3.secret-key=${AWS_SECRET_KEY}
aws.s3.region=ap-northeast-2
aws.s3.bucket=ideafestival-archive.chain
aws.s3.url-prefix=https://ideafestival-archive.chain.s3.ap-northeast-2.amazonaws.com